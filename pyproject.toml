[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2-video-stretcher"
version = "0.1.0"
description = "Aplicativo para Windows que estica gravações de gameplay do CS2."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "CS2 Video Stretcher contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cs2-video-stretcher = "cs2_stretcher.main:main"

[tool.setuptools.packages.find]
include = ["cs2_stretcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
